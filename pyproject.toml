[build-system]
requires = ["setuptools<67", "setuptools_scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sptxinsight"
description = "Run cell-typing and spatial-heterogeneity analysis on spatial transcriptomics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache License, Version 2.0" }
authors = [
  { name = "sptxinsight Team" },
]
maintainers = [
  { name = "sptxinsight Team" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The vendored H-Plot engine needs only the numeric / graph stack. niche / niche
# discovery additionally needs torch + torch_geometric and the geopandas /
# shapely GIS stack (all accepted as core deps); these are already present in
# the shared `wsinsight` env.
#
# Version bounds are chosen so sptxinsight is CO-INSTALLABLE in the shared
# `wsinsight` conda env, whose locked set (constraints.txt) pins numpy<2,
# zarr<3 and the 2025.9 generation of fsspec/s3fs/gcsfs. The upper caps below
# stop a plain `pip install` from silently upgrading those and breaking
# wsinsight's tiffslide / large-image / histomicstk stack. In a shared env,
# prefer:  pip install --no-deps -e .   (every runtime dep is already present).
dependencies = [
  "click>=8.0,<9,!=8.1.4,!=8.1.5",
  # In the shared wsinsight env, h5ad files are written by wsinsight (anndata 0.10.x)
  # so anndata 0.12 format encoding is not needed. Install with --no-deps in shared env.
  "anndata>=0.9,<0.11",
  "scanpy<1.11",
  "numpy<2.0.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "h5py",
  "tqdm",

  # Niche / niche discovery. Co-installable with the
  # shared wsinsight env (both pin torch + torch_geometric already). geopandas /
  # shapely back the annotation-level region merge (sptxinsight niche --niche-regions).
  "torch",
  "torch_geometric",
  "scikit-learn",
  "igraph",
  "leidenalg",
  "pynndescent",  # approximate kNN for the niche Leiden/kNN connectivity graph
  "joblib",
  "geopandas",
  "shapely",

  # Storage / cloud I/O (URIPath). Capped to the wsinsight 2025.9 generation;
  # the 2026.x line pulls zarr>=3 and breaks wsinsight's zarr<3 readers.
  "fsspec>=2023.1.0,<2026",
  "requests>=2.28,<3",
  "s3fs<2026",
  "gcsfs<2026",
  "platformdirs",
  # boto3 + aiobotocore pinned in range to prevent pip scanning 90+ versions;
  # exact pins can be set in constraints.txt after a first successful install.
  "aiobotocore>=2.5.4,<3.0.0",
  "boto3>=1.41,<1.42",
  # pyogrio: fast OGR backend for geopandas (no system GDAL binary required)
  "pyogrio",
]
dynamic = ["version"]

[project.optional-dependencies]
# Co-installable with the wsinsight env (zarr<3). anndata.read_zarr works with
# zarr 2.x, so the H-Plot path does not need zarr 3.
zarr = [
  "zarr<3",
]
# WARNING: spatialdata / squidpy require numpy>=2 and zarr>=3, which are
# INCOMPATIBLE with the shared wsinsight env (numpy<2, zarr<3). Install these
# extras only in a dedicated numpy-2 environment.
spatialdata = [
  "spatialdata",
]
scanpy = [
  # scanpy is now a core dependency; this extra is kept for backward
  # compatibility so existing `pip install sptxinsight[scanpy]` commands
  # continue to work without error.
]
mcp = [
  "fastmcp>=2.0",
]
# Optional KurtoRank-powered annotation / marker-prep commands.
kurtorank = [
  "kurtorank>=3.1.0",
  "scikit-misc>=0.3",
  "numpy<2.0.0",
  "zarr<3",
  "squidpy<1.7",
  "spatialdata<0.5",
  "spatialdata-io<0.7",
  "xarray<2025",
  "dask>=2024.10.0,<=2024.11.2",
  "distributed>=2024.10.0,<=2024.11.2",
]
# Cross-sample batch correction of niche embeddings (sptxinsight niche
# --niche-batch-correct harmony). Pure-Python; the 'center' method needs no extra.
harmony = [
  "harmonypy>=0.0.9",
]

[project.urls]
Repository = "https://github.com/huangch/sptxinsight"
BugTracker = "https://github.com/huangch/sptxinsight/issues"

[project.scripts]
sptxinsight = "sptxinsight.__main__:main"
sptxinsight-mcp = "sptxinsight.mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["sptxinsight*"]

[tool.setuptools.package-data]
sptxinsight = ["py.typed"]

[tool.setuptools_scm]
write_to = "sptxinsight/_version.py"
fallback_version = "0.1.0"

[tool.ruff]
extend-exclude = ["_version.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
unfixable = ["B"]

[tool.ruff.lint.isort]
force-single-line = true
